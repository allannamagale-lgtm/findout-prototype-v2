{% extends "base.html" %}
{% block title %}Sign In — FINDOUT{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <div class="text-center mb-6">
      <h2>Welcome back</h2>
      <p class="text-secondary text-sm">Sign in to your FINDOUT account.</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        <div class="text-right mt-1">
          <a href="{{ url_for('forgot_password') }}" class="text-sm text-secondary">Forgot Password?</a>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="text-center mt-5 text-sm text-secondary">
      Don't have an account? <a href="{{ url_for('signup') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
