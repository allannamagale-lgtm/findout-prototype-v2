{% extends "base.html" %}
{% block title %}Create Account — FINDOUT{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <div class="text-center mb-6">
      <h2>Create your account</h2>
      <p class="text-secondary text-sm">You must be 18 or older to use FINDOUT.</p>
    </div>
    <form method="POST" action="{{ url_for('signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name <span class="required">*</span></label>
          <input type="text" name="real_name" class="form-control" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Surname <span class="required">*</span></label>
          <input type="text" name="real_surname" class="form-control" placeholder="Surname" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Age <span class="required">*</span></label>
          <input type="number" name="age" class="form-control" placeholder="e.g. 27" min="18" max="120" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone <span class="required">*</span></label>
          <input type="tel" name="phone" class="form-control" placeholder="082 123 4567" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        <div class="form-hint">We'll send a verification link to this address.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <input type="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="8">
        <div class="form-hint">Minimum 8 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <div class="text-center mt-5 text-sm text-secondary">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
