{% extends "base.html" %}
{% block title %}New Claim — FINDOUT{% endblock %}
{% block content %}
<div class="narrow">
  <div class="mb-6">
    <h1>New Relationship Claim</h1>
    <p class="text-secondary">Make a claim about your relationship with someone. They'll be notified if they've joined FINDOUT.</p>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('claim') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name <span class="required">*</span></label>
          <input type="text" name="name" class="form-control" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Surname <span class="required">*</span></label>
          <input type="text" name="surname" class="form-control" placeholder="Surname" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Area <span class="required">*</span></label>
          <input type="text" name="area" class="form-control" placeholder="City or suburb" required>
        </div>
        <div class="form-group">
          <label class="form-label">Age <span class="required">*</span></label>
          <input type="number" name="age" class="form-control" placeholder="e.g. 27" min="18" max="120" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Phone <span class="required">*</span></label>
        <input type="tel" name="phone" class="form-control" placeholder="e.g. 082 123 4567" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Email <span class="text-secondary">(optional)</span></label>
          <input type="email" name="email" class="form-control" placeholder="their@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Work / Employer <span class="text-secondary">(optional)</span></label>
          <input type="text" name="work" class="form-control" placeholder="e.g. Standard Bank">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Relationship State <span class="required">*</span></label>
        <select name="relationship_state" class="form-control" required>
          <option value="">Select type</option>
          <option value="Talking Stage">Talking Stage</option>
          <option value="Dating">Dating</option>
          <option value="In a Relationship">In a Relationship</option>
          <option value="Engaged">Engaged</option>
          <option value="Married">Married</option>
          <option value="Separated">Separated</option>
          <option value="Divorced">Divorced</option>
          <option value="It's Complicated">It's Complicated</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Submit Claim</button>
    </form>
  </div>
</div>
{% endblock %}
